name: vanij
description: "Vanij — Local Merchant Command Center"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.1

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  # Sprint 8 — fatal-error crash reporting + minimal PII-free analytics.
  # Analytics events are enumerated in app/lib/core/analytics/events.dart
  # and never carry customer content.
  firebase_crashlytics: ^5.0.0
  firebase_analytics: ^12.0.0
  google_sign_in: ^7.2.0

  cached_network_image: ^3.4.1
  intl: ^0.20.2
  google_fonts: ^8.0.2

  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # Multipart HTTP client used only for calling the Python AI backend
  # (vision tagger, Sprint 7 LLM agent). Firebase SDKs ship their own
  # transport; we never round-trip Firestore through this client.
  http: ^1.2.2
  http_parser: ^4.1.2

  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.1.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
