[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanij-ai"
version = "0.1.0"
description = "Vanij — AI backend (FastAPI on Cloud Run). Vision tagger + LLM CRM agent."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "slowapi>=0.1.9",
    "firebase-admin>=6.5.0",
    "httpx>=0.27.0",
    # FastAPI's UploadFile / File(...) path requires python-multipart.
    # Pinned here rather than relying on fastapi[standard] because we
    # want the Cloud Run runtime image to be as small as possible.
    "python-multipart>=0.0.9",
    # Sprint 7: LLM agent via Claude Sonnet.
    "anthropic>=0.34.0",
    # Sprint 7: verify Google-signed ID tokens from the Cloud Function
    # that bridges Firestore messages to the FastAPI agent.
    "google-auth>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

# Real PyTorch-backed vision tagger. Installed only in the Cloud Run
# image built for the `torch` backend — keeps the default cold start
# (heuristic backend) snappy.
vision = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# ``fastapi.Depends(...)`` in argument defaults is the idiomatic
# dependency-injection pattern and intentionally evaluated at call time.
ignore = ["B008"]
